---
name: Build and release SpotConnect packages
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Lets upstream-check.yml invoke this workflow directly in the same run,
  # after it pushes a new tag - a tag pushed with the default GITHUB_TOKEN
  # does NOT trigger other workflows' `on: push: tags` (GitHub suppresses
  # that to prevent recursive runs), so relying on the push trigger alone
  # would silently never publish anything.
  workflow_call:
    inputs:
      release_tag:
        description: "Treat this run as a release for this tag"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the release announcement thread. Requires a Discussions
      # category literally named "Releases" to exist in this repository -
      # GitHub does not create one by default, and the release step fails
      # if it is missing.
      discussions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine whether this run should publish a release
        id: release_tag
        env:
          # Passed via env rather than interpolated into the run: script -
          # github.ref reflects whatever ref triggered the run, so it is
          # treated as untrusted input on principle.
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            TAG="$INPUT_RELEASE_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            TAG=""
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            # A tag ending in -pre / -rc.. / -beta.. / -alpha.. publishes as
            # a GitHub pre-release. Without this the first release had to be
            # marked by hand afterwards, which is easy to forget and leaves
            # the release briefly looking final to anyone watching.
            case "$TAG" in
            *-pre | *-pre.* | *-rc* | *-beta* | *-alpha*)
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              echo "Publishing ${TAG} as a PRE-RELEASE"
              ;;
            *)
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              echo "Publishing a release for tag ${TAG}"
              ;;
            esac
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Build and validate only - not a release (no tag)"
          fi

      - name: Read pinned upstream SpotConnect version
        id: upstream
        run: |
          {
            echo "version=$(jq -r .version upstream.json)"
            echo "tag=$(jq -r .tag upstream.json)"
            echo "asset=$(jq -r .asset upstream.json)"
            echo "sha256=$(jq -r .sha256 upstream.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Download pinned SpotConnect release
        uses: robinraju/release-downloader@28fc21f50d76778e7023361aa1f863e717d3d56f # v1.13
        with:
          repository: "philippe44/SpotConnect"
          tag: ${{ steps.upstream.outputs.tag }}
          tarBall: false
          zipBall: false
          fileName: "SpotConnect*.zip"
          out-file-path: "src/dsm7/bin"
          extract: true

      - name: Verify downloaded release checksum
        env:
          EXPECTED_SHA256: ${{ steps.upstream.outputs.sha256 }}
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_ASSET: ${{ steps.upstream.outputs.asset }}
        run: |
          # release-downloader with extract:true removes the archive after
          # unpacking, so re-fetch the zip to checksum the exact bytes
          # GitHub served. This is the check that would have caught the
          # corrupted release in AirConnect-Synology's issue #107.
          curl -sL -o /tmp/verify.zip \
            "https://github.com/philippe44/SpotConnect/releases/download/${UPSTREAM_TAG}/${UPSTREAM_ASSET}"
          ACTUAL_SHA256=$(sha256sum /tmp/verify.zip | awk '{print $1}')
          echo "expected: ${EXPECTED_SHA256}"
          echo "actual:   ${ACTUAL_SHA256}"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Checksum mismatch for SpotConnect ${UPSTREAM_TAG} - refusing to build from this download. If upstream deliberately re-published this tag, verify the new contents yourself and then update the sha256 in upstream.json."
            exit 1
          fi
          rm -f /tmp/verify.zip

      - name: List downloaded binaries
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          echo "Using SpotConnect ${UPSTREAM_TAG} (pinned in upstream.json)"
          ls -l "${GITHUB_WORKSPACE}"/src/dsm7/bin/

      # llvm-strip handles ELF for every target architecture, which GNU strip
      # on the runner does not - without it the bundled libraries ship
      # unstripped and several times larger.
      - name: Install llvm-strip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq llvm

      - name: Fetch bundled libstdc++ (pinned in libstdcxx.json)
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7 && ./fetch-libstdcxx.sh

      - name: Run shellcheck
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7 && make shellcheck

      # No RELEASE_VERSION here on purpose: the Makefile reads the version
      # from upstream.json, the same field upstream-check.yml uses for the
      # release tag. Passing the tag instead would make the two disagree the
      # first time upstream ships a tag that is not its version.
      - name: Build packages for all architectures
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7 && make build-all

      - name: Validate built packages (structure + ELF)
        run: |
          ls -l "${GITHUB_WORKSPACE}"/src/dsm7/dist/
          FAIL=0
          COUNT=0
          # Iterates over what build-all actually produced rather than a
          # second hand-maintained architecture list, which would go stale.
          # The arch comes from the filename; the trailing -[0-9] marks
          # where the date-suffixed version begins.
          for spk in src/dsm7/dist/SpotConnect-dsm7-*.spk; do
            [ -e "$spk" ] || continue
            COUNT=$((COUNT + 1))
            base=$(basename "$spk" .spk)
            arch=${base#SpotConnect-dsm7-}
            arch=${arch%%-[0-9]*}
            echo "::group::Validating ${spk} (arch=${arch})"
            sh tests/validate_spk.sh "$spk" || FAIL=1
            workdir=$(mktemp -d)
            tar -xf "$spk" -C "$workdir"
            tar -xzf "$workdir/package.tgz" -C "$workdir"
            python3 tests/validate_elf.py --arch "${arch}" \
              "$workdir/spotupnp" "$workdir/spotraop" || FAIL=1
            # The architectures pinned in libstdcxx.json must ship the bundled
            # libstdc++ in their dynamic package, and nothing else may. Read
            # from the pin file itself so the two cannot drift apart - and so
            # a build that silently drops the library fails here instead of
            # on a user's older NAS.
            if jq -e --arg a "$arch" '.members[$a]' libstdcxx.json >/dev/null; then want=yes; else want=no; fi
            if [ -e "$workdir/lib/libstdc++.so.6" ]; then have=yes; else have=no; fi
            if [ "$want" != "$have" ]; then
              echo "::error::${spk}: bundled libstdc++ expected=${want} present=${have}"
              FAIL=1
            fi
            rm -rf "$workdir"
            echo "::endgroup::"
          done
          # Cross-check against the Makefile's own targets, so a build-all
          # that silently skips an architecture fails CI instead of quietly
          # validating however many packages happened to appear.
          EXPECTED=$(awk '/^\.PHONY: /{t=$2} /INFO_ARCH=/{print t}' src/dsm7/Makefile | wc -l | tr -d ' ')
          echo "Validated ${COUNT} package(s); the Makefile defines ${EXPECTED} architecture(s)."
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::Built ${COUNT} .spk file(s) but the Makefile defines ${EXPECTED} architectures - build-all likely skipped one."
            FAIL=1
          fi
          exit "$FAIL"

      - name: Generate SHA256SUMS
        run: |
          cd src/dsm7/dist
          sha256sum -- *.spk > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          prerelease: ${{ steps.release_tag.outputs.is_prerelease == 'true' }}
          files: |
            src/dsm7/dist/*.spk
            src/dsm7/dist/SHA256SUMS
          discussion_category_name: Releases
          body: |
            Packaging changes: see [CHANGELOG.md](https://github.com/eizedev/SpotConnect-Synology/blob/main/CHANGELOG.md).

            Upstream SpotConnect ${{ steps.upstream.outputs.tag }} changes: see the [SpotConnect CHANGELOG](https://github.com/philippe44/SpotConnect/blob/master/CHANGELOG).

            **Which file do I need?** See [doc/ARCHITECTURES.md](https://github.com/eizedev/SpotConnect-Synology/blob/main/doc/ARCHITECTURES.md) - and note that older DSM releases and Synology routers may need the `-static` build, or may not be able to run this version at all.

            Verify a download against `SHA256SUMS` before installing:
            `sha256sum -c SHA256SUMS --ignore-missing`
          generate_release_notes: true
        if: steps.release_tag.outputs.is_release == 'true'

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: src/dsm7/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Clean up
        run: cd "${GITHUB_WORKSPACE}"/src/dsm7 && make clean clean-dist
